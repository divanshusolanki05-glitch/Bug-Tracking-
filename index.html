<!DOCTYPE html>
<html>
<head>
  <title>Bug Tracking System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Bug Tracking & QA Management System</h2>

  <!-- Bug Form -->
  <form id="bugForm">
    <input type="text" id="title" placeholder="Bug Title" required>
    <input type="text" id="desc" placeholder="Description" required>
    <select id="priority">
      <option>High</option>
      <option>Medium</option>
      <option>Low</option>
    </select>
    <select id="status">
      <option>Open</option>
      <option>In Progress</option>
      <option>Closed</option>
    </select>
    <button type="submit" class="btn">Add Bug</button>
  </form>

  <!-- Bug Table -->
  <table id="bugTable">
    <tr>
      <th>ID</th><th>Title</th><th>Description</th><th>Priority</th><th>Status</th><th>Actions</th>
    </tr>
  </table>

  <script src="script.js"></script>
</body>
</html>
